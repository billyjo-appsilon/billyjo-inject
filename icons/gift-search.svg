<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="혜택 찾기">
  <style>
    .gift{fill:#fff;stroke:#0838f8;stroke-width:3.8;stroke-linecap:round;stroke-linejoin:round}
    .ribbon{fill:none;stroke:#0838f8;stroke-width:3.8;stroke-linecap:round;stroke-linejoin:round}
    .lens{fill:#fff;stroke:#0838f8;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;transform-origin:43px 43px}
    .spark{fill:#ffd43b;stroke:#0838f8;stroke-width:2;stroke-linejoin:round;transform-origin:17px 16px}
    @media (prefers-reduced-motion:no-preference){
      .gift,.ribbon{animation:bjGiftSearchGift 1.35s ease-in-out infinite}
      .lens{animation:bjGiftSearchScan 1.15s ease-in-out infinite}
      .spark{animation:bjGiftSearchPop 1.05s ease-in-out infinite}
    }
    @keyframes bjGiftSearchGift{
      0%,100%{transform:translateY(0)}
      42%{transform:translateY(-2px)}
      68%{transform:translateY(1px)}
    }
    @keyframes bjGiftSearchScan{
      0%,100%{transform:translate(0,0) rotate(0deg)}
      38%{transform:translate(-6px,-5px) rotate(-13deg)}
      68%{transform:translate(4px,3px) rotate(8deg)}
    }
    @keyframes bjGiftSearchPop{
      0%,100%{transform:scale(.72);opacity:.45}
      45%{transform:scale(1.22) rotate(8deg);opacity:1}
    }
  </style>
  <path class="spark" d="M17 7l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L17 21.2l-5.6 3 1.1-6.2L8 13.6l6.2-.9z"/>
  <rect class="gift" x="10" y="25" width="32" height="27" rx="5"/>
  <path class="gift" d="M8 19h36v10H8z"/>
  <path class="ribbon" d="M26 19v33M13 19c0-6 6-9 13 0M39 19c0-6-6-9-13 0"/>
  <circle class="lens" cx="42" cy="41" r="10"/>
  <path class="lens" d="M49.5 48.5L58 57"/>
</svg>
